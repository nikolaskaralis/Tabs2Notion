<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs2Notion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="popup-shell">
    <div class="row-between" style="padding:4px 6px 10px">
      <div class="brand"><img src="icons/icon32.png" alt=""><span class="brand-name">Tabs2Notion</span></div>
      <button id="settingsBtn" class="ghost" title="Settings" aria-label="Settings">⚙</button>
    </div>
    <div id="connectionState" class="subtle" style="padding:0 8px 8px"></div>
    <div class="menu">
      <button data-action="current-window">Send all tabs in this window</button>
      <button id="groupBtn" data-action="current-group">Send all tabs in this tab group</button>
      <button id="selectedBtn" data-action="selected">Send selected tabs</button>
      <div class="divider"></div>
      <button data-action="current-tab">Send only this tab</button>
      <button data-action="except-current">Send all tabs except this tab</button>
      <button id="leftBtn" data-action="left">Send tabs on the left</button>
      <button data-action="right">Send tabs on the right</button>
      <button data-action="all-windows">Send all tabs from all windows</button>
      <div class="divider"></div>
      <button id="excludeBtn">Exclude current site from Tabs2Notion</button>
      <button id="dashboardBtn">Open Tabs2Notion</button>
    </div>
  </main>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
