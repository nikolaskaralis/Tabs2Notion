<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs2Notion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell stack">
    <div class="row-between">
      <div class="brand"><img src="icons/icon48.png" alt=""><span class="brand-name">Tabs2Notion</span></div>
      <div class="row"><button id="settingsBtn" class="secondary">Settings</button><a href="help.html">Help</a></div>
    </div>
    <section class="card stack">
      <h2>Quick send</h2>
      <div class="menu" style="grid-template-columns:1fr 1fr">
        <button data-action="current-window">All tabs in this window</button>
        <button data-action="current-group">Current tab group</button>
        <button data-action="selected">Selected tabs</button>
        <button data-action="current-tab">Only this tab</button>
        <button data-action="except-current">All except this tab</button>
        <button data-action="all-windows">All tabs from all windows</button>
      </div>
    </section>
    <section class="card stack">
      <div class="row-between"><h2 style="margin:0">Connected workspaces</h2><button id="connectBtn" class="primary">Connect another</button></div>
      <div id="workspaceList"></div>
    </section>
    <section class="card stack">
      <h2>Excluded sites</h2>
      <div id="excludedList"></div>
    </section>
    <div id="status" class="subtle"></div>
  </main>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
