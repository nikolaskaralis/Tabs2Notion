name = "tabs2notion-oauth"
main = "worker.js"
compatibility_date = "2026-08-01"

# Set this after the first deployment, using your Worker URL exactly:
[vars]
OAUTH_REDIRECT_URI = "https://tabs2notion-oauth.nikolaskaralis.workers.dev/oauth/callback"

